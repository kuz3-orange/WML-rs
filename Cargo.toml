[package]
name = "worst-minecraft-launcher"
version = "0.1.0"
edition = "2021"
description = "Worst Minecraft Launcher — a Minecraft launcher, allegedly."
license = "MIT"

[[bin]]
name = "wml"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha1 = "0.10"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
